[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "A local-first personal agent with a private vault and explicit permissions"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.120", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]
documents = ["pypdf>=5,<7"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
