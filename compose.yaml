services:
  jarvis:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - jarvis-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
volumes:
  jarvis-data:
