name: Verify Jarvis
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 inspected 2026-10-10
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 inspected 2026-10-10
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen --extra dev --extra documents
      - run: uv run --frozen playwright install --with-deps chromium
      - run: sh scripts/check.sh
